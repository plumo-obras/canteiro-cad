# Atualizações semanais do que fica travado: actions (por SHA), a imagem base e as dependências do Python.
# Menor e patch num PR só por ecossistema; major vem sozinho, porque é o que quebra.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-menor-e-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      imagens-menor-e-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    # pyproject.toml + uv.lock juntos (com "pip" ele só mexia no pyproject, e o lock ficava com a versão velha).
    # Bump do motor (OCR, PDF, DXF) só entra com a régua: tests/ponta_a_ponta e ferramentas/avaliar.py nos PDFs.
    directory: /
    schedule:
      interval: weekly
    groups:
      python-menor-e-patch:
        update-types: [minor, patch]
