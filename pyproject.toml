[project]
name = "canteiro-cad"
version = "1.2.0"
description = "Tradutor de pranchas estruturais do Plumo: lê o projeto estrutural (PDF do CAD ou imagem) e devolve os dados, o pacote do projeto e o modelo 3D."
requires-python = ">=3.11,<3.13"
# O motor de leitura vai travado na versão exata: OCR, rasterização do PDF e visão computacional mudam o resultado
# de uma versão para outra, e a régua (ferramentas/avaliar.py) foi medida com estas. O Dependabot propõe a troca, e
# a troca só entra com a régua rodada nos PDFs de exemplo.
dependencies = [
    "rapidocr-onnxruntime==1.4.4",
    "onnxruntime==1.31.1",
    "opencv-python-headless==5.0.0.93",
    "PyMuPDF==2.1",
    "numpy==2.4.6",
    "ezdxf==1.4.5",
    "openpyxl>=3.1.5,<4",
    "fastapi>=0.128,<1",
    "uvicorn[standard]>=0.39,<1",
    "python-multipart>=0.0.20",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.2", "ruff>=0.14", "jsonschema>=4.23"]

[project.scripts]
identificar-pranchas = "canteiro_cad.interfaces.cli.identificar:main"
atualizar-sinapi = "canteiro_cad.interfaces.cli.atualizar_sinapi:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canteiro_cad"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["canteiro_cad"]

[tool.ruff.lint.per-file-ignores]
# o motor de leitura veio do protótipo validado nos PDFs de exemplo: estilo próprio (nomes curtos, linhas longas de
# geometria). Reescrever só para o linter arriscaria a régua; ele fica fora das regras de estilo, não das de erro.
"src/canteiro_cad/infraestrutura/motor/*" = ["E501", "E701", "E702", "E731", "E741", "B007", "B023", "B905", "I", "UP"]
"ferramentas/*" = ["E401", "E501", "E701", "E702", "E731", "E741", "B007", "B905", "I", "UP"]

[tool.ruff.format]
# o motor fica como foi validado nos PDFs de exemplo; o resto do código segue o formatador
exclude = ["src/canteiro_cad/infraestrutura/motor/*"]
